<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cribl Framework — Database Browser</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #f8fafc;
      --surface: #ffffff;
      --border:  #e2e8f0;
      --accent:  #e53e3e;
      --accent2: #0284c7;
      --text:    #1e293b;
      --muted:   #64748b;
      --radius:  8px;
    }
    body { background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; line-height: 1.6; min-height: 100vh; }

    main { flex: 1; max-width: 1500px; width: 100%; margin: 0 auto; padding: 24px 2rem 80px; }

    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar select, .toolbar input[type="text"] {
      padding: 9px 14px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; background: var(--surface); color: var(--text); outline: none;
    }
    .toolbar select { min-width: 220px; cursor: pointer; }
    .toolbar input[type="text"] { flex: 1; min-width: 200px; }
    .toolbar input[type="text"]:focus, .toolbar select:focus { border-color: var(--accent2); }

    .btn { padding: 9px 18px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 500; white-space: nowrap; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--accent2); color: #fff; }
    .btn-primary:hover:not(:disabled) { opacity: .85; }
    .btn-secondary { background: #e0f2fe; color: var(--accent2); }
    .btn-secondary:hover { background: #bae6fd; }

    .info-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; font-size: 13px; color: var(--muted); }
    .info-bar strong { color: var(--text); }

    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius); overflow-x: auto; max-height: 70vh; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: var(--text); color: #fff; padding: 10px 12px; text-align: left;
      font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
      position: sticky; top: 0; z-index: 10; white-space: nowrap; cursor: pointer; user-select: none;
    }
    thead th:hover { background: #334155; }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:hover { background: #f0f7ff; }
    tbody td { padding: 8px 12px; font-size: 12px; vertical-align: top; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tbody td.expanded { white-space: normal; word-break: break-all; }
    tbody td:hover { white-space: normal; word-break: break-all; }

    .loading { text-align: center; padding: 60px; color: var(--muted); }
    .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent2); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 60px; color: var(--muted); }

    .alert-error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; border-radius: var(--radius); padding: 12px 16px; margin-bottom: 14px; font-size: .88rem; display: none; }
    .alert-error.visible { display: block; }

    .page-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 18px; }

    .pagination { display: flex; gap: 6px; align-items: center; }
    .pagination button { padding: 5px 10px; border: 1px solid var(--border); background: var(--surface); border-radius: 4px; cursor: pointer; font-size: 13px; }
    .pagination button:hover:not(:disabled) { border-color: var(--accent2); }
    .pagination button:disabled { opacity: .4; cursor: not-allowed; }

    .badge-null { color: var(--muted); font-style: italic; }

    footer { text-align: center; padding: 24px; color: var(--muted); font-size: .82rem; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
<div class="cf-app">
{% set nav_active = 'database' %}
{% include 'partials/sidebar.html' %}
<div class="cf-main">

<main>
  <h1 class="page-title">Database Browser</h1>
  <div id="alertError" class="alert-error" role="alert"></div>

  <div class="toolbar">
    <select id="tableSelect" onchange="onTableChange()">
      <option value="">— select table —</option>
    </select>
    <input type="text" id="searchInput" placeholder="Filter rows..." oninput="filterRows()">
    <button class="btn btn-primary" id="refreshBtn" onclick="loadTableData()">Refresh</button>
    <button class="btn btn-secondary" onclick="exportCSV()">Export CSV</button>
  </div>

  <div id="infoBar" class="info-bar" style="display:none;">
    <span id="rowInfo"></span>
    <div class="pagination">
      <button onclick="prevPage()" id="btnPrev" disabled>&lsaquo; Prev</button>
      <span id="pageInfo" style="font-size:13px;"></span>
      <button onclick="nextPage()" id="btnNext" disabled>Next &rsaquo;</button>
    </div>
  </div>

  <div class="table-wrap" id="tableWrap">
    <div class="empty">Select a table to browse its contents.</div>
  </div>
</main>

<footer>Cribl Framework — Database Browser</footer>

</div>
</div>

<script>
  let columns = [];
  let allRows = [];
  let filteredRows = [];
  let currentPage = 1;
  const PAGE_SIZE = 100;
  let sortCol = null;
  let sortAsc = true;

  async function loadTables() {
    try {
      const resp = await fetch('/cribl/api/db/tables');
      const data = await resp.json();
      if (data.errors) { showError(data.errors.join(' ')); return; }
      const sel = document.getElementById('tableSelect');
      data.forEach(t => {
        const o = document.createElement('option');
        o.value = t; o.textContent = t;
        sel.appendChild(o);
      });
    } catch (err) { showError(err.message); }
  }

  function onTableChange() {
    const table = document.getElementById('tableSelect').value;
    if (table) loadTableData();
    else {
      document.getElementById('tableWrap').innerHTML = '<div class="empty">Select a table to browse its contents.</div>';
      document.getElementById('infoBar').style.display = 'none';
    }
  }

  async function loadTableData() {
    const table = document.getElementById('tableSelect').value;
    if (!table) return;

    const wrap = document.getElementById('tableWrap');
    wrap.innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading ' + esc(table) + '...</div></div>';
    document.getElementById('infoBar').style.display = 'none';
    hideError();

    try {
      const resp = await fetch('/cribl/api/db/table/' + encodeURIComponent(table) + '?limit=2000');
      const data = await resp.json();
      if (data.errors) { showError(data.errors.join(' ')); wrap.innerHTML = ''; return; }

      columns = data.columns;
      allRows = data.rows;
      sortCol = null;
      currentPage = 1;
      document.getElementById('searchInput').value = '';
      filterRows();

      document.getElementById('infoBar').style.display = 'flex';
    } catch (err) {
      showError(err.message);
      wrap.innerHTML = '';
    }
  }

  function filterRows() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    filteredRows = allRows.filter(row => {
      if (!q) return true;
      return columns.some(c => String(row[c] || '').toLowerCase().includes(q));
    });
    currentPage = 1;
    renderTable();
  }

  function sortBy(col) {
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = true; }
    filteredRows.sort((a, b) => {
      let va = a[col], vb = b[col];
      if (va == null) va = '';
      if (vb == null) vb = '';
      const cmp = String(va).localeCompare(String(vb), undefined, { numeric: true });
      return sortAsc ? cmp : -cmp;
    });
    currentPage = 1;
    renderTable();
  }

  function renderTable() {
    const wrap = document.getElementById('tableWrap');
    const total = filteredRows.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * PAGE_SIZE;
    const end = Math.min(start + PAGE_SIZE, total);
    const page = filteredRows.slice(start, end);

    document.getElementById('rowInfo').innerHTML =
      'Showing <strong>' + (total > 0 ? start + 1 : 0) + '</strong>–<strong>' + end +
      '</strong> of <strong>' + total + '</strong>' +
      (total < allRows.length ? ' (filtered from ' + allRows.length + ')' : '');
    document.getElementById('pageInfo').textContent = 'Page ' + currentPage + ' / ' + totalPages;
    document.getElementById('btnPrev').disabled = currentPage <= 1;
    document.getElementById('btnNext').disabled = currentPage >= totalPages;

    if (page.length === 0) {
      wrap.innerHTML = '<div class="empty">No rows found.</div>';
      return;
    }

    let html = '<table><thead><tr>';
    html += '<th style="width:40px;cursor:default;">#</th>';
    columns.forEach(c => {
      const arrow = sortCol === c ? (sortAsc ? ' &#9650;' : ' &#9660;') : '';
      html += '<th onclick="sortBy(\'' + esc(c) + '\')">' + esc(c) + arrow + '</th>';
    });
    html += '</tr></thead><tbody>';

    page.forEach((row, i) => {
      html += '<tr>';
      html += '<td style="color:#cbd5e1;font-size:11px;text-align:right;">' + (start + i + 1) + '</td>';
      columns.forEach(c => {
        const val = row[c];
        if (val === null || val === undefined) {
          html += '<td><span class="badge-null">null</span></td>';
        } else if (typeof val === 'object') {
          html += '<td title="' + esc(JSON.stringify(val)) + '">' + esc(JSON.stringify(val)) + '</td>';
        } else {
          html += '<td title="' + esc(String(val)) + '">' + esc(String(val)) + '</td>';
        }
      });
      html += '</tr>';
    });

    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  function prevPage() { if (currentPage > 1) { currentPage--; renderTable(); document.getElementById('tableWrap').scrollTop = 0; } }
  function nextPage() { currentPage++; renderTable(); document.getElementById('tableWrap').scrollTop = 0; }

  function exportCSV() {
    if (!filteredRows.length) return;
    const rows = [columns.join(',')];
    filteredRows.forEach(row => {
      rows.push(columns.map(c => csvEsc(row[c])).join(','));
    });
    const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const table = document.getElementById('tableSelect').value || 'export';
    a.download = table + '_' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  function esc(str) {
    const div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML.replace(/'/g, '&#39;');
  }
  function csvEsc(val) {
    if (val === null || val === undefined) return '';
    let str = typeof val === 'object' ? JSON.stringify(val) : String(val);
    if (str.indexOf(',') !== -1 || str.indexOf('"') !== -1 || str.indexOf('\n') !== -1) {
      return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  }
  function showError(msg) { const el = document.getElementById('alertError'); el.textContent = msg; el.classList.add('visible'); }
  function hideError() { document.getElementById('alertError').classList.remove('visible'); }

  loadTables();
</script>
</body>
</html>
