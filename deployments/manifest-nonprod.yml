image:
  # The Image name will be overridden by CD process
  name: ""
  # The Image tag will be overridden by CD process
  tag: ""

# appfile as python startup file with extension .py or appscript value as a startup shell script. If both are mentioned only appfile value is effective
#appfile: app.py
appscript: app.sh

podLabels: {}

route:
  enabled: true
  # hostName: <Host name override. If not provided openshift will auto generate the host name>

autoscaling:
  enabled: false
  # minReplicas: 4
  # maxReplicas: 6
  # targetCPUAverageValue: 4
  # targetMemoryAverageValue: 3Gi

cyberark:
  containername: authenticator
  user: aro-nonprod-appXXXXXXXX
  secrets:
    - name: AZURE_CLIENT_NAME
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/AZURESP-azure-hcsc-nonprod-XXXXXXXX007/username"
    - name: AZURE_CLIENT_SECRET
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/AZURESP-azure-hcsc-nonprod-XXXXXXXX007/password"
    - name: DATABASE_URL
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/cribl-elk-psql-nonprod/database-url/value"
    - name: SECRET_KEY
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/cribl-elk-psql-nonprod/secret-key/value"
    - name: ADMIN_USERNAME
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/cribl-elk-psql-nonprod/admin-username/value"
    - name: ADMIN_PASSWORD
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/cribl-elk-psql-nonprod/admin-password/value"
    - name: ES_DATASTREAM_URL
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/cribl-elk-psql-nonprod/es-datastream-url/value"
    - name: ES_DATASTREAM_USERNAME
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/cribl-elk-psql-nonprod/es-datastream-username/value"
    - name: ES_DATASTREAM_PASSWORD
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/cribl-elk-psql-nonprod/es-datastream-password/value"
    - name: ENT_ES_CLUSTERS
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/cribl-elk-psql-nonprod/ent-es-clusters/value"
    # Bearer token the portal sends to etn-onboarding. MUST equal the token in
    # etn's AUTH_LOCAL_USERS, or the catalog's /api/requests/ fetch and the
    # post-provision transition both 401. (Secret kept here with the others; the
    # non-secret service URLs live in deployment.yml and are merged in by CD.)
    - name: ETN_ONBOARDING_TOKEN
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/cribl-elk-psql-nonprod/etn-onboarding-token/value"
    # Cribl creds for the service-catalog per-workspace login (fallback used when
    # the mounted config.json leaves base_url/credentials empty).
    - name: CRIBL_BASE_URL
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/cribl-elk-psql-nonprod/cribl-base-url/value"
    - name: CRIBL_TOKEN
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/cribl-elk-psql-nonprod/cribl-token/value"

service:
  type: http
  port: 5000

ssl:
  debug:
    enabled: false

runTests:
  enabled: false

# Allows multiple jobs scheduled for different purposes atleast one job is required.
# NOTE: sample maintenance job below — replace schedule/resources with real jobs,
# or drop this section and switch appType if this service runs no scheduled jobs.
jobs:
  #------------------------------Job for MT------------------------------
  - subname: mt
    schedule: "0 3 * * 0"

    podLabels: { job-for: MT }

    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 1
        memory: 2Gi
