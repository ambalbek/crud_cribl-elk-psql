{{- if .Values.networkPolicy.enabled }}
{{- if .Values.framework.enabled }}
---
# Portal: reachable from anywhere on 5000 by default (it sits behind a
# Route/Ingress whose router lives in another namespace); narrow the sources
# with networkPolicy.portalFrom.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-cribl-framework
  labels:
    {{- include "cf.labels" (dict "root" $ "name" "cribl-framework") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cf.selectorLabels" (dict "root" $ "name" "cribl-framework") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 5000
          protocol: TCP
      {{- with .Values.networkPolicy.portalFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.criblService.enabled }}
---
# cribl_service: only the portal and etn_onboarding may call it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-cribl-service
  labels:
    {{- include "cf.labels" (dict "root" $ "name" "cribl-service") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cf.selectorLabels" (dict "root" $ "name" "cribl-service") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8001
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "cf.selectorLabels" (dict "root" $ "name" "cribl-framework") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "cf.selectorLabels" (dict "root" $ "name" "etn-onboarding") | nindent 14 }}
{{- end }}
{{- if .Values.eceService.enabled }}
---
# ece_service: only the portal and etn_onboarding may call it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ece-service
  labels:
    {{- include "cf.labels" (dict "root" $ "name" "ece-service") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cf.selectorLabels" (dict "root" $ "name" "ece-service") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8002
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "cf.selectorLabels" (dict "root" $ "name" "cribl-framework") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "cf.selectorLabels" (dict "root" $ "name" "etn-onboarding") | nindent 14 }}
{{- end }}
{{- if .Values.etnOnboarding.enabled }}
---
# etn_onboarding: only the portal may call it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-etn-onboarding
  labels:
    {{- include "cf.labels" (dict "root" $ "name" "etn-onboarding") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cf.selectorLabels" (dict "root" $ "name" "etn-onboarding") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 5000
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "cf.selectorLabels" (dict "root" $ "name" "cribl-framework") | nindent 14 }}
{{- end }}
{{- end }}
