{{- if .Values.etnOnboarding.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-etn-onboarding
  labels:
    {{- include "cf.labels" (dict "root" $ "name" "etn-onboarding") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cf.selectorLabels" (dict "root" $ "name" "etn-onboarding") | nindent 4 }}
{{- end }}
