{{- if .Values.eceService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ece-service
  labels:
    {{- include "cf.labels" (dict "root" $ "name" "ece-service") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cf.selectorLabels" (dict "root" $ "name" "ece-service") | nindent 4 }}
{{- end }}
