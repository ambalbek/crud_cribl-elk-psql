{{- if .Values.criblService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cribl-service
  labels:
    {{- include "cf.labels" (dict "root" $ "name" "cribl-service") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cf.selectorLabels" (dict "root" $ "name" "cribl-service") | nindent 4 }}
{{- end }}
