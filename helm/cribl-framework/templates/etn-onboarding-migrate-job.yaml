{{- if and .Values.etnOnboarding.enabled .Values.etnOnboarding.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-etn-onboarding-migrate
  labels:
    {{- include "cf.labels" (dict "root" $ "name" "etn-onboarding-migrate") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.etnOnboarding.migrationJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.etnOnboarding.migrationJob.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.etnOnboarding.migrationJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "cf.selectorLabels" (dict "root" $ "name" "etn-onboarding-migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "cf.podCommon" . | nindent 6 }}
      {{- include "cf.podScheduling" (dict "comp" .Values.etnOnboarding) | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "cf.image" (dict "image" .Values.etnOnboarding.image) | quote }}
          imagePullPolicy: {{ .Values.etnOnboarding.image.pullPolicy | default .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
          # Create/backfill the enum types (the models use create_type=False and
          # NO migration issues CREATE TYPE, so a bare `flask db upgrade` fails on
          # a fresh DB), then upgrade. cd into the package dir so `wsgi:app` and
          # alembic's relative migrations/ both resolve (WORKDIR is /app, code is
          # under /app/etn_onboarding).
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cd "$(dirname "$(python -c 'import etn_onboarding, os; print(os.path.dirname(etn_onboarding.__file__))' 2>/dev/null || echo /app/etn_onboarding)")" 2>/dev/null || cd /app/etn_onboarding
              python - <<'PY'
              import os, psycopg2
              conn = psycopg2.connect(os.environ["DATABASE_URL"]); conn.autocommit = True
              cur = conn.cursor()
              for stmt in [
                  "DO $$ BEGIN CREATE TYPE request_status_enum AS ENUM ('intake_pending','intake_validated','engagement','solutioning','storage_pending','storage_confirmed','delivery_destination','delivery_pack','delivery_route','delivery_collection','delivery_routing','delivery_storage','delivery_complete','delivery_failed','validation','reverify','complete','cancelled'); EXCEPTION WHEN duplicate_object THEN NULL; END $$;",
                  "DO $$ BEGIN CREATE TYPE job_type_enum AS ENUM ('cribl_edge','etn_portal','harness_blob'); EXCEPTION WHEN duplicate_object THEN NULL; END $$;",
                  "DO $$ BEGIN CREATE TYPE job_status_enum AS ENUM ('pending','running','success','failed'); EXCEPTION WHEN duplicate_object THEN NULL; END $$;",
              ]:
                  cur.execute(stmt)
              for val in ('storage_pending','storage_confirmed','delivery_destination','delivery_pack','delivery_route','delivery_collection','delivery_routing','delivery_storage','delivery_complete','delivery_failed','validation','reverify','complete','cancelled'):
                  cur.execute("ALTER TYPE request_status_enum ADD VALUE IF NOT EXISTS %s" % repr(val))
              cur.close(); conn.close(); print("Enum types ready.")
              PY
              flask --app wsgi:app db upgrade
          # This hook runs BEFORE the release's manifests are applied, so it
          # cannot envFrom the chart-managed secret on first install — the
          # database URL is set inline (or from an existing, pre-created secret).
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: LOG_LEVEL
              value: {{ .Values.global.logLevel | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.global.logFormat | quote }}
            {{- with .Values.global.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.etnOnboarding.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.etnOnboarding.existingSecret }}
                  key: DATABASE_URL
            {{- else }}
            - name: DATABASE_URL
              value: {{ .Values.external.postgres.etnDatabaseUrl | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.etnOnboarding.resources | nindent 12 }}
{{- end }}
