{{- if .Values.framework.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cribl-framework
  labels:
    {{- include "cf.labels" (dict "root" $ "name" "cribl-framework") | nindent 4 }}
spec:
  type: {{ .Values.framework.service.type }}
  ports:
    - port: {{ .Values.framework.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cf.selectorLabels" (dict "root" $ "name" "cribl-framework") | nindent 4 }}
{{- end }}
