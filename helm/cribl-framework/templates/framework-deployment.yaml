{{- if .Values.framework.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cribl-framework
  labels:
    {{- include "cf.labels" (dict "root" $ "name" "cribl-framework") | nindent 4 }}
spec:
  replicas: {{ .Values.framework.replicaCount }}
  revisionHistoryLimit: 3
  {{- if .Values.framework.persistence.enabled }}
  # RWO snapshots volume — a surge pod could not attach it on another node.
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "cf.selectorLabels" (dict "root" $ "name" "cribl-framework") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cf.selectorLabels" (dict "root" $ "name" "cribl-framework") | nindent 8 }}
        {{- with .Values.framework.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/framework-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/framework-secret.yaml") . | sha256sum }}
        checksum/appconfig: {{ include (print $.Template.BasePath "/framework-config-secret.yaml") . | sha256sum }}
        {{- with .Values.framework.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "cf.podCommon" . | nindent 6 }}
      {{- include "cf.podScheduling" (dict "comp" .Values.framework) | nindent 6 }}
      containers:
        - name: cribl-framework
          image: {{ include "cf.image" (dict "image" .Values.framework.image) | quote }}
          imagePullPolicy: {{ .Values.framework.image.pullPolicy | default .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-cribl-framework-env
            - secretRef:
                name: {{ .Values.framework.existingSecret | default (printf "%s-cribl-framework" .Release.Name) }}
          {{- if .Values.framework.extraEnv }}
          env:
            {{- include "cf.extraEnv" (dict "extra" .Values.framework.extraEnv) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: app-config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            - name: snapshots
              mountPath: /app/cribl_snapshots
            {{- with .Values.framework.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # config.json parse + db.create_all() happen at import — give the
          # process time before liveness kicks in.
          startupProbe:
            httpGet:
              path: /cribl/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          # /cribl/health is liveness-only — it does not check dependencies
          # (see docs/RUNBOOK.md §3).
          livenessProbe:
            httpGet:
              path: /cribl/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /cribl/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.framework.resources | nindent 12 }}
      volumes:
        - name: app-config
          secret:
            secretName: {{ .Values.framework.config.existingSecret | default (printf "%s-cribl-framework-appconfig" .Release.Name) }}
        - name: snapshots
          {{- if .Values.framework.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-cribl-framework-snapshots
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.framework.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
