{{- if and .Values.framework.enabled .Values.framework.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-cribl-framework-snapshots
  labels:
    {{- include "cf.labels" (dict "root" $ "name" "cribl-framework") | nindent 4 }}
  annotations:
    # Keep rollback snapshots when the release is deleted.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.framework.persistence.size }}
  {{- if .Values.framework.persistence.storageClass }}
  storageClassName: {{ .Values.framework.persistence.storageClass }}
  {{- end }}
{{- end }}
