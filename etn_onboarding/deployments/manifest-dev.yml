image:
  # The Image name will be overridden by CD process
  name: ""
  # The Image tag will be overridden by CD process
  tag: ""

# appfile as python startup file with extension .py or appscript value as a startup shell script. If both are mentioned only appfile value is effective
#appfile: app.py
appscript: app.sh

podLabels: {}

route:
  enabled: false
  # hostName: <Host name override. If not provided openshift will auto generate the host name>

autoscaling:
  enabled: false
  # minReplicas: 4
  # maxReplicas: 6
  # targetCPUAverageValue: 4
  # targetMemoryAverageValue: 3Gi

cyberark:
  containername: authenticator
  user: aro-dev-appXXXXXXXX
  secrets:
    - name: AZURE_CLIENT_NAME
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/AZURESP-azure-hcsc-dev-XXXXXXXX007/username"
    - name: AZURE_CLIENT_SECRET
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/AZURESP-azure-hcsc-dev-XXXXXXXX007/password"
    - name: DATABASE_URL
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/cribl-elk-psql-dev/database-url/value"
    - name: SECRET_KEY
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/cribl-elk-psql-dev/secret-key/value"
    # AUTH_LOCAL_USERS: JSON list, e.g.
    #   [{"username":"portal","token":"<same token the portal uses as ETN_ONBOARDING_TOKEN>","roles":["platform_admin"]}]
    # Without this env var the pod defaults to "[]" → zero users → every bearer
    # token 401s → catalog unauthorized AND the post-provision transition is
    # silently blocked. The token MUST equal the portal's ETN_ONBOARDING_TOKEN.
    - name: AUTH_LOCAL_USERS
      value: "ConjurSync/AAM_NONPROD01/AAM-XXXXXXXX-CON-T-01-ONS/cribl-elk-psql-dev/etn-auth-local-users/value"

service:
  type: http
  port: 5000

ssl:
  debug:
    enabled: false

runTests:
  enabled: false

# Allows multiple jobs scheduled for different purposes atleast one job is required.
# NOTE: sample maintenance job below — replace schedule/resources with real jobs,
# or drop this section and switch appType if this service runs no scheduled jobs.
jobs:
  #------------------------------Job for MT------------------------------
  - subname: mt
    schedule: "0 3 * * 0"

    podLabels: { job-for: MT }

    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 1
        memory: 2Gi
