version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: etn-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: etn_user
      POSTGRES_PASSWORD: etn_pass
      POSTGRES_DB: etn_onboarding
    volumes:
      - etn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etn_user -d etn_onboarding"]
      interval: 10s
      timeout: 5s
      retries: 5

  etn-onboarding:
    build: .
    container_name: etn-onboarding
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://etn_user:etn_pass@postgres:5432/etn_onboarding"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
      AUTH_BACKEND: "local"
      AUTH_LOCAL_USERS: >-
        [
          {"username": "admin", "token": "admin-dev-token", "roles": ["platform_admin"]},
          {"username": "reader", "token": "reader-dev-token", "roles": ["reader"]}
        ]
      CRIBL_SERVICE_URL: "${CRIBL_SERVICE_URL:-http://host.docker.internal:8001}"
      ECE_SERVICE_URL: "${ECE_SERVICE_URL:-http://host.docker.internal:8002}"
      ETN_PORTAL_URL: "${ETN_PORTAL_URL:-}"
      ETN_PORTAL_API_KEY: "${ETN_PORTAL_API_KEY:-}"
      OTEL_SERVICE_NAME: "etn-onboarding"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"

volumes:
  etn_pgdata:
