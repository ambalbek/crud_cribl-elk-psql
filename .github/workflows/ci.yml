name: CI

on:
  push:
    branches: [main, feature-*]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etn_onboarding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app/ --ignore-missing-imports --no-error-summary

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etn_onboarding
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: etn_user
          POSTGRES_PASSWORD: etn_pass
          POSTGRES_DB: etn_onboarding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etn_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://etn_user:etn_pass@localhost:5432/etn_onboarding_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v --tb=short

  validate-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate deployment.yml (multi-service)
        run: |
          python -c "
          import yaml, sys

          with open('deployment.yml') as f:
              config = yaml.safe_load(f)

          dep = config.get('deployment', {})
          required_top = ['appType', 'appId', 'namespace']
          for key in required_top:
              if key not in dep:
                  print(f'ERROR: missing top-level key: {key}')
                  sys.exit(1)

          services = dep.get('services', [])
          if not services:
              # fallback: single-service format
              if 'serviceName' not in dep:
                  print('ERROR: no services list and no serviceName found')
                  sys.exit(1)
              services = [dep]

          required_svc = ['serviceName', 'port', 'healthCheck']
          for i, svc in enumerate(services):
              for key in required_svc:
                  if key not in svc:
                      print(f'ERROR: service {i} missing key: {key}')
                      sys.exit(1)
              print(f'  OK: {svc[\"serviceName\"]} (port {svc[\"port\"]}, health: {svc[\"healthCheck\"]})')

          print(f'Validated {len(services)} service(s)')
          "

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - run: helm lint etn_onboarding/helm/etn-onboarding
      - run: helm lint --strict helm/cribl-framework
      - run: helm template ci helm/cribl-framework > /dev/null
