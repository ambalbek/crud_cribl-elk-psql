apiVersion: v1
kind: Secret
metadata:
  name: cribl-elk-psql-secrets
  namespace: appXXXXXXXX-cribl-elk-psql
  labels:
    app: cribl-elk-psql
type: Opaque
stringData:
  # ── cribl-framework ──────────────────────────────────────────────────────────
  # Flask session signing key
  secret-key: "CHANGEME"
  # PostgreSQL connection string
  database-url: "postgresql://etn_user:CHANGEME@postgres-host:5432/cribl_framework"
  # Portal admin login (overrides config.json auth.local_admins)
  admin-username: "admin"
  admin-password: "CHANGEME"
  # Elasticsearch datastream (onboarding request storage)
  es-datastream-url: "https://elasticsearch-host:9200"
  es-datastream-username: "elastic"
  es-datastream-password: "CHANGEME"
  # Entitlement clusters (ELK role mapping lookups)
  # JSON array — supports multiple clusters with different credentials.
  # For a single cluster you can use ENT_ES_URL/ENT_ES_USERNAME/ENT_ES_PASSWORD instead.
  ent-es-clusters: |
    [
      {
        "name": "production",
        "url": "https://elk-prod-host:9200",
        "username": "elastic",
        "password": "CHANGEME"
      },
      {
        "name": "nonprod",
        "url": "https://elk-nonprod-host:9200",
        "username": "elastic",
        "password": "CHANGEME"
      }
    ]
  # etn-onboarding inter-service token
  etn-onboarding-token: "CHANGEME"

  # ── cribl-service ────────────────────────────────────────────────────────────
  cribl-base-url: "https://cribl-stream-host:9000"
  cribl-token: "CHANGEME"

  # ── ece-service ──────────────────────────────────────────────────────────────
  ece-es-url: "https://elasticsearch-host:9200"
  ece-es-token: "CHANGEME"

  # ── etn-onboarding ──────────────────────────────────────────────────────────
  etn-database-url: "postgresql://etn_user:CHANGEME@postgres-host:5432/etn_onboarding"
