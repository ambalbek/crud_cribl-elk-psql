apiVersion: apps/v1
kind: Deployment
metadata:
  name: etn-onboarding
  namespace: appXXXXXXXX-cribl-elk-psql
  labels:
    app: cribl-elk-psql
    app.kubernetes.io/part-of: cribl-elk-psql
    component: etn-onboarding
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"cribl-service"},{"apiVersion":"apps/v1","kind":"Deployment","name":"ece-service"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      component: etn-onboarding
  template:
    metadata:
      labels:
        app: cribl-elk-psql
        component: etn-onboarding
    spec:
      containers:
        - name: etn-onboarding
          image: nexus.XXXXXXXX.com:8083/etn-onboarding:latest
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: OPENSSL_CONF
              value: /dev/null
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: etn-database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: secret-key
            - name: AUTH_BACKEND
              value: "local"
            - name: AUTH_LOCAL_USERS
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: etn-auth-local-users
            - name: CRIBL_SERVICE_URL
              value: "http://cribl-service:8001"
            - name: ECE_SERVICE_URL
              value: "http://ece-service:8002"
          # Startup probe guards the slow first boot: entrypoint.sh waits for
          # Postgres, creates enum types and runs `flask db upgrade` BEFORE
          # gunicorn binds the port. Without this, the liveness probe fires at
          # 30s and crashloops the pod before migrations finish — so the schema
          # never gets the newer enum values and status updates fail. Allows up
          # to 5 min (30 * 10s) for migrations.
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
