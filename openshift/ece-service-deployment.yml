apiVersion: apps/v1
kind: Deployment
metadata:
  name: ece-service
  namespace: appXXXXXXXX-cribl-elk-psql
  labels:
    app: cribl-elk-psql
    component: ece-service
spec:
  replicas: 1
  selector:
    matchLabels:
      component: ece-service
  template:
    metadata:
      labels:
        app: cribl-elk-psql
        component: ece-service
    spec:
      containers:
        - name: ece-service
          image: nexus.XXXXXXXX.com:8083/ece-service:latest
          ports:
            - containerPort: 8002
              protocol: TCP
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: cribl-elk-psql-config
                  key: log-level
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: cribl-elk-psql-config
                  key: log-format
            - name: ECE_ES_URL
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: ece-es-url
            - name: ECE_ES_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: ece-es-token
            - name: ECE_SKIP_SSL
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
