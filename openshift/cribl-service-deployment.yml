apiVersion: apps/v1
kind: Deployment
metadata:
  name: cribl-service
  namespace: appXXXXXXXX-cribl-elk-psql
  labels:
    app: cribl-elk-psql
    app.kubernetes.io/part-of: cribl-elk-psql
    component: cribl-service
spec:
  replicas: 1
  selector:
    matchLabels:
      component: cribl-service
  template:
    metadata:
      labels:
        app: cribl-elk-psql
        component: cribl-service
    spec:
      containers:
        - name: cribl-service
          image: nexus.XXXXXXXX.com:8083/cribl-service:latest
          ports:
            - containerPort: 8001
              protocol: TCP
          env:
            - name: OPENSSL_CONF
              value: /dev/null
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: cribl-elk-psql-config
                  key: log-level
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: cribl-elk-psql-config
                  key: log-format
          volumeMounts:
            - name: app-config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: app-config
          secret:
            secretName: cribl-framework-appconfig
