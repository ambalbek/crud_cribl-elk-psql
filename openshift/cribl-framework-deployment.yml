apiVersion: apps/v1
kind: Deployment
metadata:
  name: cribl-framework
  namespace: appXXXXXXXX-cribl-elk-psql
  labels:
    app: cribl-elk-psql
    app.kubernetes.io/part-of: cribl-elk-psql
    component: cribl-framework
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"cribl-service"},{"apiVersion":"apps/v1","kind":"Deployment","name":"ece-service"},{"apiVersion":"apps/v1","kind":"Deployment","name":"etn-onboarding"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      component: cribl-framework
  template:
    metadata:
      labels:
        app: cribl-elk-psql
        component: cribl-framework
    spec:
      containers:
        - name: cribl-framework
          image: nexus.XXXXXXXX.com:8083/cribl-framework:latest
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: OPENSSL_CONF
              value: /dev/null
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: cribl-elk-psql-config
                  key: log-level
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: cribl-elk-psql-config
                  key: log-format
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: database-url
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: admin-password
            - name: ES_DATASTREAM_URL
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: es-datastream-url
            - name: ES_DATASTREAM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: es-datastream-username
            - name: ES_DATASTREAM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: es-datastream-password
            - name: ENT_ES_CLUSTERS
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: ent-es-clusters
            - name: ETN_ONBOARDING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: etn-onboarding-token
            # Cribl creds for the service catalog's per-workspace login. The
            # catalog falls back to these when config.json has no base_url/creds,
            # so provide them here (they match cribl-service's env).
            - name: CRIBL_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: cribl-base-url
            - name: CRIBL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cribl-elk-psql-secrets
                  key: cribl-token
            - name: CRIBL_SERVICE_URL
              value: "http://cribl-service:8001"
            - name: ECE_SERVICE_URL
              value: "http://ece-service:8002"
            - name: ETN_ONBOARDING_URL
              value: "http://etn-onboarding:5000"
          volumeMounts:
            - name: app-config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
          # Startup probe covers the first boot (config load + db.create_all /
          # column sync against Postgres). Liveness/readiness only begin once
          # this succeeds, so a slow DB on startup doesn't crashloop the pod.
          startupProbe:
            httpGet:
              path: /cribl/health
              port: 5000
            periodSeconds: 10
            failureThreshold: 24
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /cribl/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /cribl/health
              port: 5000
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: app-config
          secret:
            secretName: cribl-framework-appconfig
