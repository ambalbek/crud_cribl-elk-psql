apiVersion: v1
kind: Service
metadata:
  name: cribl-framework
  namespace: appXXXXXXXX-cribl-elk-psql
  labels:
    app: cribl-elk-psql
    component: cribl-framework
spec:
  selector:
    component: cribl-framework
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: cribl-service
  namespace: appXXXXXXXX-cribl-elk-psql
  labels:
    app: cribl-elk-psql
    component: cribl-service
spec:
  selector:
    component: cribl-service
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
