apiVersion: v1
kind: ConfigMap
metadata:
  name: cribl-elk-psql-config
  namespace: appXXXXXXXX-cribl-elk-psql
  labels:
    app: cribl-elk-psql
data:
  log-level: "INFO"
  log-format: "text"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cribl-framework-appconfig
  namespace: appXXXXXXXX-cribl-elk-psql
  labels:
    app: cribl-elk-psql
data:
  config.json: |
    {
      "auth": {
        "_comment": "Credentials injected via ADMIN_USERNAME/ADMIN_PASSWORD env vars from Secret.",
        "session_lifetime_minutes": 480,
        "secure_cookie": true,
        "local_admins": [],
        "local_users": []
      },

      "base_url": "",
      "cribl_urls": [],
      "elk_urls": [],
      "skip_ssl": false,

      "credentials": {
        "_comment": "Injected via CRIBL_TOKEN or CRIBL_USERNAME/CRIBL_PASSWORD env vars from Secret.",
        "token": "",
        "username": "",
        "password": ""
      },

      "route_templates": {
        "azn": "route_template_azn.json",
        "azs": "route_template_azs.json"
      },
      "dest_prefixes": {
        "azn": "hcsc-blob-storage-northcentralus",
        "azs": "hcsc-blob-storage-southcentralus"
      },
      "snapshot_dir": "cribl_snapshots",
      "min_existing_total_routes": 1,
      "diff_lines": 3,

      "workspaces": {
        "dev": {
          "worker_groups": [
            "default", "wg-dev-01", "wg-dev-02", "wg-dev-03", "wg-dev-04",
            "wg-dev-05", "wg-dev-06", "wg-dev-07", "wg-dev-08",
            "wg-dev-09", "wg-dev-10", "wg-dev-11", "wg-dev-12"
          ],
          "dest_templates": {
            "azn": "blob_dest_template_azn_dev.json",
            "azs": "blob_dest_template_azs_dev.json"
          },
          "description": "Development workspace"
        },
        "test": {
          "worker_groups": [
            "wg-test-01", "wg-test-02", "wg-test-03", "wg-test-04",
            "wg-test-05", "wg-test-06", "wg-test-07", "wg-test-08",
            "wg-test-09", "wg-test-10", "wg-test-11", "wg-test-12"
          ],
          "dest_templates": {
            "azn": "blob_dest_template_azn_test.json",
            "azs": "blob_dest_template_azs_test.json"
          },
          "description": "Test workspace"
        },
        "prod": {
          "worker_groups": [
            "wg-prod-01", "wg-prod-02", "wg-prod-03", "wg-prod-04",
            "wg-prod-05", "wg-prod-06", "wg-prod-07", "wg-prod-08",
            "wg-prod-09", "wg-prod-10", "wg-prod-11", "wg-prod-12"
          ],
          "dest_templates": {
            "azn": "blob_dest_template_azn_prod.json",
            "azs": "blob_dest_template_azs_prod.json"
          },
          "description": "Production workspace",
          "require_allow": true
        }
      },

      "portal": {
        "url": "",
        "admin_secret": "",
        "skip_ssl": false,
        "timeout": 10
      },

      "iiq_url": "https://iiq.company.com/MOYAACESS",
      "dynatrace_url": "https://dynatrace.company.com/questionnaire",

      "datastream": {
        "_comment": "Credentials injected via ES_DATASTREAM_* env vars from Secret.",
        "elk_url": "",
        "token": "",
        "username": "",
        "password": "",
        "index": "cribl-onboarding-requests",
        "skip_ssl": false,
        "timeout": 30
      },

      "entitlement": {
        "_comment": "Cluster credentials injected via ENT_ES_* env vars from Secret.",
        "clusters": [],
        "entitlementFilter": "entitlements"
      }
    }
