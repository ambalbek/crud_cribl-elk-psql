# Local Kubernetes deployment — includes Elasticsearch, Cribl Stream, Postgres, and all 4 services.
# Usage:
#   kubectl apply -f k8s-local/all-in-one.yml
#   kubectl create secret generic cribl-framework-appconfig --from-file=config.json -n cribl-elk-psql
#   kubectl rollout restart deployment -n cribl-elk-psql --all

apiVersion: v1
kind: Namespace
metadata:
  name: cribl-elk-psql

---
# ── Elasticsearch ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: cribl-elk-psql
spec:
  replicas: 1
  selector:
    matchLabels:
      component: elasticsearch
  template:
    metadata:
      labels:
        component: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "true"
            - name: ELASTIC_PASSWORD
              value: "changeme"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: "1"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "curl -sf -u elastic:changeme http://localhost:9200/_cluster/health || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: cribl-elk-psql
spec:
  selector:
    component: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200

---
# ── PostgreSQL ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cribl-elk-psql
spec:
  replicas: 1
  selector:
    matchLabels:
      component: postgres
  template:
    metadata:
      labels:
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: cribl
            - name: POSTGRES_PASSWORD
              value: cribl
            - name: POSTGRES_DB
              value: cribl
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cribl"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cribl-elk-psql
spec:
  selector:
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
# ── Cribl Stream ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cribl-stream
  namespace: cribl-elk-psql
spec:
  replicas: 1
  selector:
    matchLabels:
      component: cribl-stream
  template:
    metadata:
      labels:
        component: cribl-stream
    spec:
      containers:
        - name: cribl-stream
          image: cribl/cribl:latest
          ports:
            - containerPort: 9000
          env:
            - name: CRIBL_DIST_MODE
              value: master
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cribl-stream
  namespace: cribl-elk-psql
spec:
  selector:
    component: cribl-stream
  ports:
    - port: 9000
      targetPort: 9000

---
# ── cribl-framework ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cribl-framework
  namespace: cribl-elk-psql
  labels:
    component: cribl-framework
spec:
  replicas: 1
  selector:
    matchLabels:
      component: cribl-framework
  template:
    metadata:
      labels:
        component: cribl-framework
    spec:
      containers:
        - name: cribl-framework
          image: cribl-framework:local
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: OPENSSL_CONF
              value: /dev/null
          volumeMounts:
            - name: app-config
              mountPath: /opt/app-root/src/config-secret
              readOnly: true
          readinessProbe:
            httpGet:
              path: /cribl/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /cribl/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: app-config
          secret:
            secretName: cribl-framework-appconfig
---
apiVersion: v1
kind: Service
metadata:
  name: cribl-framework
  namespace: cribl-elk-psql
spec:
  selector:
    component: cribl-framework
  ports:
    - port: 5000
      targetPort: 5000
  type: NodePort

---
# ── cribl-service ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cribl-service
  namespace: cribl-elk-psql
  labels:
    component: cribl-service
spec:
  replicas: 1
  selector:
    matchLabels:
      component: cribl-service
  template:
    metadata:
      labels:
        component: cribl-service
    spec:
      containers:
        - name: cribl-service
          image: cribl-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:
            - name: OPENSSL_CONF
              value: /dev/null
          volumeMounts:
            - name: app-config
              mountPath: /opt/app-root/src/config-secret
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: app-config
          secret:
            secretName: cribl-framework-appconfig
---
apiVersion: v1
kind: Service
metadata:
  name: cribl-service
  namespace: cribl-elk-psql
spec:
  selector:
    component: cribl-service
  ports:
    - port: 8001
      targetPort: 8001

---
# ── ece-service ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ece-service
  namespace: cribl-elk-psql
  labels:
    component: ece-service
spec:
  replicas: 1
  selector:
    matchLabels:
      component: ece-service
  template:
    metadata:
      labels:
        component: ece-service
    spec:
      containers:
        - name: ece-service
          image: ece-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
          env:
            - name: OPENSSL_CONF
              value: /dev/null
          volumeMounts:
            - name: app-config
              mountPath: /opt/app-root/src/config-secret
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: app-config
          secret:
            secretName: cribl-framework-appconfig
---
apiVersion: v1
kind: Service
metadata:
  name: ece-service
  namespace: cribl-elk-psql
spec:
  selector:
    component: ece-service
  ports:
    - port: 8002
      targetPort: 8002

---
# ── etn-onboarding ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etn-onboarding
  namespace: cribl-elk-psql
  labels:
    component: etn-onboarding
spec:
  replicas: 1
  selector:
    matchLabels:
      component: etn-onboarding
  template:
    metadata:
      labels:
        component: etn-onboarding
    spec:
      containers:
        - name: etn-onboarding
          image: etn-onboarding:local
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: OPENSSL_CONF
              value: /dev/null
          volumeMounts:
            - name: app-config
              mountPath: /opt/app-root/src/config-secret
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: app-config
          secret:
            secretName: cribl-framework-appconfig
---
apiVersion: v1
kind: Service
metadata:
  name: etn-onboarding
  namespace: cribl-elk-psql
spec:
  selector:
    component: etn-onboarding
  ports:
    - port: 5000
      targetPort: 5000
