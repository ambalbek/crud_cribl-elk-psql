<style>

            color:#7C93AB;line-height:1.5;border-top:1px solid #22364C}

         background-image:radial-gradient(#E2E9F0 1px,transparent 1px);
         background-size:22px 22px}

        background:linear-gradient(transparent,rgba(247,249,252,.96) 40%);

const D = {"pages":[{"key":"overall","level":"1","title":"How an application gets onboarded","sub":"The whole thing on one page. Onboarding means selecting a data type and attaching the matching Cribl Pack.","notes":["The service sits between application teams who want monitoring and the three systems that implement it: Cribl Stream for routing, Elasticsearch/Kibana for search, and Azure Blob for archive.","data_type (what system produced the log) maps to a vetted Cribl Pack in a registry table. That is the whole feature. We do not generate pipelines.","Blob containers are created manually and verified \u2014 never auto-created."],"root":{"id":"root","name":"","kind":"group","sub":"","desc":"","icon":"","cols":3,"children":[{"id":"g_ask","name":"Who asks","kind":"group","sub":"","desc":"","icon":"","cols":1,"children":[{"id":"team","name":"Application team","kind":"person","sub":"Wants their app monitored","desc":"Fills in one request form with data type, log types, regions, and entitlement groups.","icon":""},{"id":"platform","name":"Platform team","kind":"person","sub":"Reviews and configures","desc":"Validates the request, agrees the detail, and triggers the delivery stages.","icon":""}]},{"id":"svc","name":"Application Onboarding Service","kind":"platform","sub":"Four microservices behind one portal","desc":"One request in, a working monitoring setup out. The portal orchestrates intake through delivery without calling Cribl or Elasticsearch directly.","icon":"","cols":2,"children":[{"id":"c_intake","name":"Take the request (Intake)","kind":"capability","sub":"","desc":"One front door. The form knows who you are when you sign in. Validates and queues.","icon":""},{"id":"c_design","name":"Agree what\u2019s needed (Solutioning)","kind":"capability","sub":"","desc":"A guided session using a standard workbook. Entity mapping, data sources, volumes, retention.","icon":""},{"id":"c_deliver","name":"Set it all up (Delivery)","kind":"capability","sub":"","desc":"Six deli ate machine","sub":"13 stages from intake to complete. Any stage can cancel. Delivery stages can fail.","notes":["The state machine follows: intake_pending \u2192 intake_validated \u2192 engagement \u2192 solutioning \u2192 storage_pending \u2192 storage_confirmed \u2192 delivery_destination \u2192 delivery_pack \u2192 delivery_route \u2192 delivery_collection \u2192 delivery_complete \u2192 validation \u2192 reverify \u2192 complete.","reverify is a human gate \u2014 the platform team re-verifies the full configuration before marking complete. No automated checks run here.","data_type and log_type are orthogonal. data_type is what system produced the log (Mulesoft). log_type is the business category (RIM, TRANS, BIZ, LGLHLD)."],"root":{"id":"root","name":"","kind":"group","sub":"","desc":"","icon":"","cols":3,"children":[{"id":"g_early","name":"Early stages","kind":"group","sub":"Request submission and planning","desc":"","icon":"","cols":1,"children":[{"id":"s_ip","name":"intake_pending","kind":"capability","sub":"Initial state","desc":"Request submitted with app name, apmId, data_type, regions, log types. Pack pinned from registry.","icon":""},{"id":"s_iv","name":"intake_validated","kind":"capability","sub":"Form validated","desc":"All required fields present. apmId unique. Pack exists and is approved.","icon":""},{"id":"s_eng","name":"engagement","kind":"capability","sub":"Discovery meeting","desc":"Platform team and app team agree on scope and timeline.","icon":""},{"id":"s_sol","name":"solutioning","kind":"capability","sub":"Workbook and mapping","desc":"Entity mapping, data sources, volumes, retention, entitlement groups collected.","icon":""}]},{"id":"g_delivery","name":"Delivery stages","kind":"group","sub":"Can transition to delivery_failed or cancelled","desc":"","icon":"","cols":1,"children":[{"id":"s_sp","name":"storage_pending","kind":"accent","sub":"Verify blob container","desc":"Checks that the manually-created container exists via a write-and-delete probe. Never creates it.","icon":""},{"id":"s_sc","name":"storage_confirmed","kind":"accent","sub":"Container verified","desc":"Write-delete probe succeeded. Container name and verification timestamp recorded.","icon":""},{"id":"s_dd","name":"delivery_destination","kind":"accent","sub":"Create Cribl destination","desc":"Azure Blob destination created in Cribl. create_container option explicitly false.","icon":""},{"id":"s_dp","name":"delivery_pack","kind":"accent","sub":"Attach Cribl Pack","desc":"Vetted pack from registry attached to route or source. Pack version pinned at intake.","icon":""},{"id":"s_dr","name":"delivery_route","kind":"accent","sub":"Create Cribl route","desc":"Route with apmId filter inserted above first final:true route.","icon":""},{"id":"s_dc","name":"delivery_collection","kind":"accent","sub":"Configure Edge fleet","desc":"Cribl Edge fleet configured for log collection from the application.","icon":""},{"id":"s_done","name":"delivery_complete","kind":"accent","sub":"All jobs succeeded","desc":"All delivery jobs tracked individually. Each has status, external ref, and result.","icon":""}]},{"id":"g_close","name":"Closing stages","kind":"group","sub":"Human gates before completion","desc":"","icon":"","cols":1,"children":[{"id":"s_val","name":"validation","kind":"capability","sub":"Customer demo","desc":"Dashboard handed over, demonstrated, and signed off by the customer.","icon":""},{"id":"s_rev","name":"reverify","kind":"capability","sub":"Platform re-check","desc":"Human gate. Platform team re-verifies routes, packs, destinations, storage. No automated checks.","icon":""},{"id":"s_comp","name":"complete","kind":"capability","sub":"Final state","desc":"Onboarding finished. Can still transition to cancelled.","icon":""},{"id":"s_fail","name":"delivery_failed","kind":"external","sub":"From any delivery stage","desc":"Delivery stage failed. Can transition to cancelled.","icon":""},{"id":"s_cancel","name":"cancelled","kind":"external","sub":"Ter stash, Kibana.","icon":"","cols":1,"children":[]},{"id":"d_entitlement","name":"entitlement (Flask)","kind":"platform","sub":"Port 5002, optional","desc":"Elasticsearch entitlement and role-mapping query service.","icon":"","cols":1,"children":[]},{"id":"d_eso","name":"External Secrets Operator","kind":"infra","sub":"Kubernetes operator","desc":"Pulls credentials from the vault into the cluster. Refreshes on rotation.","icon":""},{"id":"d_route","name":"Route and Service","kind":"infra","sub":"TLS edge, ClusterIP","desc":"Terminates TLS and balances traffic across replicas.","icon":""}]}]},{"id":"g_outside","name":"Everything the application talks to","kind":"group","sub":"","desc":"","icon":"","cols":2,"children":[{"id":"d_pg","name":"Onboarding database","kind":"store","sub":"Azure Database for PostgreSQL 16","desc":"Requests, immutable audit log, delivery jobs, pack registry. Managed service, private endpoint.","icon":""},{"id":"g_identity","name":"Identity and secrets","kind":"group","sub":"","desc":"","icon":"","cols":1,"children":[{"id":"d_sso","name":"Single sign-on","kind":"external","sub":"OIDC","desc":"","icon":""},{"id":"d_vault","name":"CyberArk Conjur","kind":"external","sub":"Credential vault","desc":"Holds every credential, with rotation and audit.","icon":""}]},{"id":"g_targets","name":"Provisioning targets","kind":"group","sub":"","desc":"","icon":"","cols":1,"children":[{"id":"d_cribl","name":"Cribl Stream","kind":"external","sub":"REST :9000","desc":"Routes, destinations, packs. 48 worker groups across 4 regions x 3 environments x 4 types.","icon":""},{"id":"d_elk","name":"ELK Stack","kind":"external","sub":"REST :9200","desc":"Roles, mappings, ILM, Logstash pipelines, Kibana dashboards.","icon":""},{"id":"d_blob","name":"Azure Blob Storage","kind":"external","sub":"Archive","desc":"Manually created containers. Verified, never auto-created. 90-day retention.","icon":""}]},{"id":"d_etn_portal","name":"ETN Admin Portal","kind":"external","sub":"Hosted externally","desc":"External portal integration for routing configuration.","icon":""}]}]}},{"key":"data","level":"5","title":"Data model and CLI tools","sub":"PostgreSQL schema, pack registry, and the two operationally live CLI scripts.","notes":["Four database tables: onboarding_requests, audit_logs, delivery_jobs, pack_registry.","Pack registry maps data_type to pack_id + pack_version. Only status='approved' packs are ever referenced.","cribl-pusher.py and role_rm.py are used in production today. All existing flags must keep working."],"root":{"id":"root","name":"","kind":"group","sub":"","desc":"","icon":"","cols":3,"children":[{"id":"g_db","name":"PostgreSQL tables","kind":"group","sub":"Owned by etn_onboarding, managed via Alembic migrations","desc":"","icon":"","cols":1,"children":[{"id":"t_req","name":"onboarding_requests","kind":"store","sub":"Core request table","desc":"UUID PK, app_name, apm_id (unique), data_type, log_types (JSONB), regions, status enum, pack_id, pack_version, storage_container, entity_mapping (JSONB), form_data (JSONB).","icon":""},{"id":"t_audit","name":"audit_logs","kind":"store","sub":"Immutable trail","desc":"FK to request. Stage, action, actor, outcome, metadata (JSONB). Cascade delete with request.","icon":""},{"id":"t_jobs","name":"delivery_jobs","kind":"store","sub":"Job tracking","desc":"FK to request. Job type (cribl_edge, etn_portal, harness_blob), status (pending/running/success/failed), external_ref, result (JSONB).","icon":""},{"id":"t_packs","name":"pack_registry","kind":"store","sub":"Vetted packs","desc":"data_type (unique) \u2192 pack_id + pack_version. attachment (route|pipeline). status (approved|draft|deprecated). Only approved packs referenced.","icon":""}]},{"id":"g_cli","name":"CLI tools (operationally live)","kind":"group","sub":"Used in production today","desc":"","icon":"","cols":1,"children":[{"id":"cli_pusher","name":"cribl-pusher.py","kind":"capability","sub":"Bulk Cribl provisioning","desc":"Interactive /* ---- accurate text measurement, so nothing ever overflows ---- */
const mc = document.createElement("canvas").getContext("2d");
function tw(t, px, weight) {
  mc.font = `${weight||400} ${px}px Inter, "Segoe UI", Helvetica, Arial, sans-serif`;
  return mc.measureText(t).width;
}
function wrap(t, px, weight, maxw) {
  if (!t) return [];
  const words = String(t).split(/\s+/); const out = []; let line = "";
  for (const w of words) {
    const cand = line ? line + " " + w : w;
    if (tw(cand, px, weight) <= maxw || !line) line = cand;
    else { out.push(line); line = w; }
  }
  if (line) out.push(line);
  return out;
}

/* ---- sizing ---- */
const PAD = 20, GAP = 16, TILE_W = 232, ICON = 40;
const F = { name: 14.5, sub: 11, desc: 11.5, gname: 14, gsub: 11 };
const LH = { name: 19, sub: 15, desc: 16 };

function measure(n) {
  if (!n.children.length) {
    const w = TILE_W, inner = w - 24;
    let h = 14;
    if (n.icon) h += ICON + 8;
    h += wrap(n.name, F.name, 650, inner).length * LH.name;
    if (n.sub) h += wrap(n.sub, F.sub, 400, inner).length * LH.sub;
    if (n.desc) h += 5 + wrap(n.desc, F.desc, 400, inner).length * LH.desc;
    n.w = w; n.h = Math.max(96, h + 14);
    return;
  }
  n.children.forEach(measure);
  const kids = n.children;
  const cols = Math.min(kids.length,
    n.cols || (kids.length === 1 ? 1 : kids.length <= 4 ? 2 : kids.length <= 9 ? 3 : 4));
  const leaves = kids.filter(c => !c.children.length);
  if (leaves.length) {
    const lw = Math.max(...leaves.map(c => c.w));
    leaves.forEach(c => { c.w = lw; });
  }
  const rows = [];
  for (let i = 0; i < kids.length; i += cols) rows.push(kids.slice(i, i + cols));
  rows.forEach(r => { const rh = Math.max(...r.map(c => c.h)); r.forEach(c => { if (!c.children.length) c.h = rh; }); });
  const inner = Math.max(...rows.map(r => r.reduce((a, c) => a + c.w, 0) + (r.length - 1) * GAP));
  n._rows = rows;
  n.w = inner + 2 * PAD;
  const iw = n.w - 2 * PAD;
  let hdr = 12;
  hdr += wrap(n.name, F.gname, 700, iw).length * 19;
  if (n.sub) hdr += wrap(n.sub, F.gsub, 400, iw).length * 15;
  if (n.desc) hdr += wrap(n.desc, F.desc, 400, iw).length * 16;
  n._hdr = hdr + 14;
  n.h = n._hdr + rows.reduce((a, r) => a + Math.max(...r.map(c => c.h)), 0)
        + (rows.length - 1) * GAP + PAD;
}
function place(n, x, y) {
  n.x = x; n.y = y;
  if (!n.children.length) return;
  let cy = y + n._hdr;
  for (const r of n._rows) {
    let cx = x + PAD;
    const rh = Math.max(...r.map(c => c.h));
    for (const c of r) { place(c, cx, cy); cx += c.w + GAP; }
    cy += rh + GAP;
  }
}

/* ---- palette: light tiles, coloured frames ---- */
const C = {
  platform:  { frame:"#0F6CBD", tint:"#EAF3FB", tile:"#FFFFFF", txt:"#0B4F8A" },
  capability:{ frame:"#0F6CBD", tint:"#FFFFFF", tile:"#FFFFFF", txt:"#16232F" },
  part:      { frame:"#7FA9CE", tint:"#FFFFFF", tile:"#FFFFFF", txt:"#16232F" },
  store:     { frame:"#B5539C", tint:"#FCF1F8", tile:"#FFFFFF", txt:"#8C3B77" },
  person:    { frame:"#16232F", tint:"#F3F5F7", tile:"#FFFFFF", txt:"#16232F" },
  external:  { frame:"#5F7183", tint:"#F6F8FA", tile:"#FFFFFF", txt:"#3E4E5E" },
  infra:     { frame:"#8B9AA8", tint:"#F7F9FB", tile:"#FFFFFF", txt:"#3E4E5E" },
  group:     { frame:"#C3CFDA", tint:"transparent", tile:"#FFFFFF", txt:"#41556A" },
  groupdark: { frame:"#C3CFDA", tint:"transparent", tile:"#FFFFFF", txt:"#41556A" },
  accent:    { frame:"#D9730D", tint:"#FDF3E7", tile:"#FFFFFF", txt:"#8A4A05" },
};

let cur = 0, vb = null;

function el(t, a, p) {
  const n = document.createElementNS(SVGNS, t);
  for (const k in a) n.setAttribute(k, a[k]);
  if (p) p.appendChild(n);
  return n;
}
function txt(p, s, x, y, px, weight, fill, anchor) {
  const t = el("text", { x, y, "font-size": px, "font-weight": weight || 400,
    fill, "font-family": "var(--sans)", "text-anchor": anchor || "start" }, p);
  t.textContent = s;
  return t;
}

function draw(n, g) {
  const c = C[n.kind] || C.group;
  const grp = n.children.length > 0;
  const gg = el("g", { class: grp ? "grp" : "tile" }, g);

  el("rect", { class: "bd", x: n.x, y: n.y, width: n.w, height: n.h,
    rx: grp ? 10 : 8, fill: grp ? c.tint : c.tile,
    stroke: c.frame, "stroke-width": grp ? 1.6 : 1.2,
    "stroke-dasharray": (n.kind === "group" || n.kind === "groupdark") ? "7 6" : "none" }, gg);

  if (grp) {
    // accent stripe so nested frames stay distinguishable
    if (n.kind !== "group" && n.kind !== "groupdark")
      el("rect", { x: n.x, y: n.y, width: 4, height: n.h, rx: 2, fill: c.frame }, gg);
    let ty = n.y + 26;
    const iw = n.w - 2 * PAD;
    for (const ln of wrap(n.name, F.gname, 700, iw)) {
      txt(gg, ln, n.x + PAD, ty, F.gname, 700, c.txt); ty += 19;
    }
    for (const ln of wrap(n.sub, F.gsub, 400, iw)) {
      txt(gg, ln, n.x + PAD, ty, F.gsub, 400, "#6B7E92"); ty += 15;
    }
    for (const ln of wrap(n.desc, F.desc, 400, iw)) {
      txt(gg, ln, n.x + PAD, ty, F.desc, 400, "#6B7E92"); ty += 16;
    }
    n.children.forEach(k => draw(k, g));
    return;
  }

  const cx = n.x + n.w / 2, iw = n.w - 24;
  let ty = n.y + 16;
  if (n.icon && D.icons[n.icon]) {
    el("image", { href: D.icons[n.icon], x: cx - ICON / 2, y: ty,
      width: ICON, height: ICON }, gg);
    ty += ICON + 8;
  }
  ty += 4;
  for (const ln of wrap(n.name, F.name, 650, iw)) {
    txt(gg, ln, cx, ty + 8, F.name, 650, c.txt, "middle"); ty += LH.name;
  }
  for (const ln of wrap(n.sub, F.sub, 400, iw)) {
    txt(gg, ln, cx, ty + 6, F.sub, 400, "#7C8DA0", "middle"); ty += LH.sub;
  }
  if (n.desc) { ty += 4;
    for (const ln of wrap(n.desc, F.desc, 400, iw)) {
      txt(gg, ln, cx, ty + 6, F.desc, 400, "#5C6E80", "middle"); ty += LH.desc;
    }
  }
}

function render(i) {
  cur = i;
  const p = D.pages[i];
  measure(p.root); place(p.root, 0, 0);
  const svg = $("cv");
  svg.innerHTML = "";
  const m = 26;
  vb = { x: -m, y: -m, w: p.root.w + 2 * m, h: p.root.h + 2 * m };
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  const g = el("g", {}, svg);
  draw(p.root, g);

  $("ttl").textContent = p.title;
  $("sub").textContent = p.sub;
  $("foot").innerHTML = p.notes.map(n => `<div>${n}</div>`).join("");
  rail();
}

function rail() {
  const box = $("pages"); box.innerHTML = "";
  D.pages.forEach((p, i) => {
    const b = document.createElement("button");
    b.className = "pg";
    b.setAttribute("aria-current", i === cur ? "true" : "false");
    b.innerHTML = `<span class="n">${p.level}</span>
      <span><span class="t">${p.title}</span></span>`;
    b.onclick = () => render(i);
    box.appendChild(b);
  });
}

(function () {
  const svg = $("cv"); let drag = null;
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const k = e.deltaY > 0 ? 1.12 : 1 / 1.12;
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    vb = { x: vb.x + (vb.w - vb.w * k) * px, y: vb.y + (vb.h - vb.h * k) * py,
           w: vb.w * k, h: vb.h * k };
    svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  }, { passive: false });
  svg.addEventListener("pointerdown", e => {
    drag = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y };
    svg.classList.add("drag"); svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", e => {
    if (!drag) return;
    const r = svg.getBoundingClientRect();
    vb.x = drag.vx - (e.clientX - drag.x) * (vb.w / r.width);
    vb.y = drag.vy - (e.clientY - drag.y) * (vb.h / r.height);
    svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  });
  ["pointerup", "pointercancel"].forEach(t =>
    svg.addEventListener(t, () => { drag = null; svg.classList.remove("drag"); }));
})();

$("fit").onclick = () => render(cur);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowRight") render(Math.min(D.pages.length - 1, cur + 1));
  if (e.key === "ArrowUp" || e.key === "ArrowLeft") render(Math.max(0, cur - 1));
});

document.fonts && document.fonts.ready.then(() => render(0));
render(0);
</script>
</body>
