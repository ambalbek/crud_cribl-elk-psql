services:
  # ── ELK Stack ───────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    restart: unless-stopped
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:MxrKcKT=0AedtIyI8O6y http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── Observability ───────────────────────────────────────────────────────────
  apm-server:
    image: docker.elastic.co/apm/apm-server:8.17.0
    restart: unless-stopped
    command: >
      apm-server -e
        -E apm-server.host=0.0.0.0:8200
        -E output.elasticsearch.hosts=["http://elasticsearch:9200"]
        -E apm-server.kibana.enabled=true
        -E apm-server.kibana.host=http://kibana:5601
        -E setup.kibana.host=http://kibana:5601
        -E apm-server.secret_token=
    ports:
      - "127.0.0.1:8200:8200"   # APM / OTLP receiver
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "apm-server export config > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  cribl-edge:
    image: cribl/cribl:latest
    restart: unless-stopped
    environment:
      - CRIBL_BOOT_START_MODE=managed-edge
    ports:
      - "127.0.0.1:9420:9420"   # Cribl Edge UI
    volumes:
      - cribl_edge_data:/opt/cribl/state
      - ./cribl-edge/local/cribl/inputs.yml:/opt/cribl/local/cribl/inputs.yml
      - ./cribl-edge/local/cribl/outputs.yml:/opt/cribl/local/cribl/outputs.yml
    depends_on:
      elasticsearch:
        condition: service_healthy

  cribl-framework:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"   # localhost only — use a reverse proxy for external access
    volumes:
      - ./config.json:/app/config.json:ro          # secrets never in image
      - ./cribl_snapshots:/app/cribl_snapshots     # persist snapshots across restarts
    environment:
      - LOG_LEVEL=INFO
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - DATABASE_URL=postgresql://etn_user:etn_pass@etn_postgres:5432/cribl_framework
      - ES_DATASTREAM_URL=http://elasticsearch:9200
      - ES_DATASTREAM_USERNAME=elastic
      - ES_DATASTREAM_PASSWORD=MxrKcKT=0AedtIyI8O6y
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://apm-server:8200}
      - CRIBL_SERVICE_URL=http://cribl_service:8001
      - ECE_SERVICE_URL=http://ece_service:8002
      - ETN_ONBOARDING_URL=http://etn_onboarding:5000
      - ETN_ONBOARDING_TOKEN=${ETN_ONBOARDING_TOKEN:-framework-internal-token}
    depends_on:
      cribl_service:
        condition: service_healthy
      ece_service:
        condition: service_healthy
      etn_onboarding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/cribl/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  etn_onboarding:
    build:
      context: ./etn_onboarding
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    depends_on:
      etn_postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://etn_user:etn_pass@etn_postgres:5432/etn_onboarding
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - AUTH_BACKEND=local
      - AUTH_LOCAL_USERS=[{"username":"framework","token":"${ETN_ONBOARDING_TOKEN:-framework-internal-token}","roles":["platform_admin"]}]
      - CRIBL_SERVICE_URL=http://cribl_service:8001
      - ECE_SERVICE_URL=http://ece_service:8002
      - ETN_PORTAL_URL=${ETN_PORTAL_URL:-}
      - ETN_PORTAL_API_KEY=${ETN_PORTAL_API_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://apm-server:8200}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  etn_postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: etn_user
      POSTGRES_PASSWORD: etn_pass
      POSTGRES_DB: etn_onboarding
    volumes:
      - etn_pgdata:/var/lib/postgresql/data
      - ./etn_onboarding/init-extra-dbs.sql:/docker-entrypoint-initdb.d/init-extra-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etn_user -d etn_onboarding"]
      interval: 10s
      timeout: 5s
      retries: 5

  cribl_service:
    build:
      context: .                              # project root — needed to COPY shared .py files
      dockerfile: cribl_service/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"                # internal only; cribl-framework reaches it via service name
    env_file:
      - cribl_service/.env
    environment:
      - LOG_LEVEL=INFO
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://apm-server:8200}
      - CRIBL_BASE_URL=${CRIBL_BASE_URL:-}
      - CRIBL_TOKEN=${CRIBL_TOKEN:-}
      - CRIBL_USERNAME=${CRIBL_USERNAME:-}
      - CRIBL_PASSWORD=${CRIBL_PASSWORD:-}
      - CRIBL_SKIP_SSL=${CRIBL_SKIP_SSL:-false}
      - CRIBL_TIMEOUT=${CRIBL_TIMEOUT:-30}
      - CRIBL_DEFAULT_WORKSPACE=${CRIBL_DEFAULT_WORKSPACE:-default}
      - CRIBL_DEFAULT_ROUTES_TABLE=${CRIBL_DEFAULT_ROUTES_TABLE:-default}
      - CRIBL_MIN_EXISTING_ROUTES=${CRIBL_MIN_EXISTING_ROUTES:-1}
      - CRIBL_SNAPSHOT_DIR=${CRIBL_SNAPSHOT_DIR:-cribl_snapshots}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  ece_service:
    build:
      context: .                              # project root — needed to COPY role_rm.py + shared .py files
      dockerfile: ece_service/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"                # internal only
    volumes:
      - ./ops_rm_r_templates_output:/app/ops_rm_r_templates_output  # ELK template output
    env_file:
      - ece_service/.env
    environment:
      - LOG_LEVEL=INFO
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://apm-server:8200}
      # Elasticsearch — nonprod
      - ECE_ES_URL=${ECE_ES_URL:-}
      - ECE_ES_TOKEN=${ECE_ES_TOKEN:-}
      - ECE_ES_USERNAME=${ECE_ES_USERNAME:-}
      - ECE_ES_PASSWORD=${ECE_ES_PASSWORD:-}
      # Elasticsearch — prod
      - ECE_ES_URL_PROD=${ECE_ES_URL_PROD:-}
      - ECE_ES_TOKEN_PROD=${ECE_ES_TOKEN_PROD:-}
      - ECE_ES_USERNAME_PROD=${ECE_ES_USERNAME_PROD:-}
      - ECE_ES_PASSWORD_PROD=${ECE_ES_PASSWORD_PROD:-}
      # Kibana
      - ECE_KIBANA_URL=${ECE_KIBANA_URL:-}
      - ECE_KIBANA_TOKEN=${ECE_KIBANA_TOKEN:-}
      - ECE_KIBANA_USERNAME=${ECE_KIBANA_USERNAME:-}
      - ECE_KIBANA_PASSWORD=${ECE_KIBANA_PASSWORD:-}
      - ECE_SKIP_SSL=${ECE_SKIP_SSL:-false}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  es_data:
  cribl_edge_data:
  etn_pgdata: